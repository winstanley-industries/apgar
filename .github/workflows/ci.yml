name: CI

on:
  merge_group:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux
    runs-on: ${{ vars.APGAR_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Configure Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
          disk-cache: ${{ github.workflow }}-${{ runner.os }}-${{ runner.arch }}
          repository-cache: true
      - name: Lint
        run: bazel lint
      - name: Build
        run: bazel build --lockfile_mode=error //...
      - name: Test
        run: bazel test --lockfile_mode=error //...

  macos:
    name: macOS
    runs-on: ${{ vars.APGAR_MACOS_RUNNER || 'macos-15' }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Configure Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
          disk-cache: ${{ github.workflow }}-${{ runner.os }}-${{ runner.arch }}
          repository-cache: true
      - name: Build
        run: bazel build --lockfile_mode=error //...
      - name: Test
        run: bazel test --lockfile_mode=error //...

  sanitizer:
    name: Sanitizer (${{ matrix.config }})
    runs-on: ${{ vars.APGAR_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        config:
          - asan
          - ubsan
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Configure Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
          disk-cache: ${{ github.workflow }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.config }}
          repository-cache: true
      - name: Test with ${{ matrix.config }}
        run: bazel test --config=${{ matrix.config }} --lockfile_mode=error //...
